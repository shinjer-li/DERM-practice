<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse — MedFlash</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    /* ── Browse-specific styles ── */
    .browse-layout {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 57px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 57px;
      height: calc(100vh - 57px);
      overflow-y: auto;
      padding: 16px 0;
    }

    .sidebar-search {
      padding: 0 14px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .sidebar-search input {
      width: 100%;
      padding: 6px 10px;
      font-size: 0.82rem;
      font-family: var(--sans);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text-primary);
    }

    .sidebar-search input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .sidebar-section {
      margin-bottom: 4px;
    }

    .sidebar-section-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 8px 14px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-section-label i { font-size: 0.85rem; }

    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 14px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 0;
      transition: background 0.12s, color 0.12s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: var(--sans);
    }

    .sidebar-item:hover {
      background: var(--bg);
      color: var(--text-primary);
    }

    .sidebar-item.active {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    .sidebar-item .count {
      font-size: 0.7rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .sidebar-item.active .count {
      color: var(--accent);
      opacity: 0.7;
    }

    .sidebar-item.no-images {
      opacity: 0.4;
      cursor: default;
    }

    .sidebar-item.no-images:hover {
      background: none;
      color: var(--text-secondary);
    }

    /* ── Main content ── */
    .browse-main {
      flex: 1;
      min-width: 0;
      padding: 28px 32px 60px;
    }

    .browse-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .browse-title {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 400;
    }

    .browse-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Image grid ── */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .grid-item {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      position: relative;
    }

    .grid-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .grid-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .grid-item-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 5px 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,9,8,0.85);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .lightbox img {
      max-width: 100%;
      max-height: calc(90vh - 80px);
      object-fit: contain;
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: block;
    }

    .lightbox-label {
      font-family: var(--serif);
      font-size: 1.2rem;
      color: #fff;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .lightbox-close:hover { background: rgba(255,255,255,0.2); }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav.prev { left: -52px; }
    .lightbox-nav.next { right: -52px; }
    /* ── Practice modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,18,14,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 440px;
      width: 90%;
      box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .modal-subtitle { font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .form-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: var(--sans);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-primary);
      box-sizing: border-box;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }
    /* ── Empty / loading ── */
    .browse-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .browse-empty i {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
    }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .browse-main { padding: 20px 16px 40px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <span class="site-logo">Shinjer's <span>Practice</span></span>
    <nav class="site-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="browse.html" class="nav-link active">Browse</a>
    </nav>
  </div>
</header>

<div class="browse-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-search">
      <input type="search" id="sidebar-search" placeholder="Filter diseases…" autocomplete="off" />
    </div>
    <div id="sidebar-nav"></div>
  </aside>

  <!-- Main -->
  <main class="browse-main">
    <div class="browse-header">
      <h1 class="browse-title" id="browse-title">All images</h1>
      <div class="browse-actions">
        <span id="browse-count" style="font-size:0.82rem;color:var(--text-muted)"></span>
        <button class="btn btn-sm btn-primary" id="practice-btn" onclick="practiceCurrentView()">
          <i class="ti ti-player-play" aria-hidden="true"></i> Practice
        </button>
      </div>
    </div>
    <div id="image-grid-container"></div>
  </main>

</div>

<!-- Browse Practice Modal -->
<div class="modal-overlay" id="browse-modal" role="dialog" aria-modal="true">
  <div class="modal">
    <h2>Practice</h2>
    <p class="modal-subtitle" id="browse-modal-subtitle"></p>
    <div class="form-group">
      <label class="form-label" for="browse-image-count">Number of images</label>
      <input class="form-input" type="number" id="browse-image-count" min="1" value="20" />
      <div style="font-size:0.78rem;color:var(--text-muted);margin-top:4px" id="browse-images-available"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="browse-shuffle-toggle">Order</label>
      <select class="form-input" id="browse-shuffle-toggle">
        <option value="shuffle">Shuffled</option>
        <option value="sequential">Sequential</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
      <button class="btn" onclick="closeBrowseModal()">Cancel</button>
      <button class="btn btn-primary" onclick="startBrowsePractice()">
        <i class="ti ti-player-play"></i> Start
      </button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
    <button class="lightbox-nav prev" onclick="lightboxNav(-1)" aria-label="Previous">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
    </button>
    <img id="lightbox-img" src="" alt="" />
    <div class="lightbox-label" id="lightbox-label"></div>
    <button class="lightbox-nav next" onclick="lightboxNav(1)" aria-label="Next">
      <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>

<script src="catalog.js"></script>
<script src="app.js"></script>
<script>
  let currentDisease = null; // null = all
  let lightboxImages  = [];
  let lightboxIndex   = 0;

  // ── Init ─────────────────────────────────────────────────────
  async function init() {
    await loadManifest();
    buildSidebar();
    showDisease(null);

    // URL param: ?disease=Name
    const params = new URLSearchParams(location.search);
    const d = params.get('disease');
    if (d) selectDisease(d);

    document.getElementById('sidebar-search').addEventListener('input', filterSidebar);
  }

  // ── Sidebar ───────────────────────────────────────────────────
  function buildSidebar() {
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'sidebar-item active';
    allBtn.id = 'nav-all';
    const total = Object.values(MANIFEST).reduce((s, v) => s + v.length, 0);
    allBtn.innerHTML = `<span>All images</span><span class="count">${total}</span>`;
    allBtn.onclick = () => selectDisease(null);
    nav.appendChild(allBtn);

    for (const system of CATALOG) {
      const section = document.createElement('div');
      section.className = 'sidebar-section';
      section.dataset.systemId = system.id;

      const systemTotal = system.groups.flatMap(g => g.diseases).reduce((n, d) => n + getImagesForDisease(d).length, 0);

      const header = document.createElement('div');
      header.className = 'sidebar-section-label sidebar-section-toggle';
      header.style.cursor = 'pointer';
      header.style.userSelect = 'none';
      header.innerHTML = `
        <i class="ti ${system.icon}" aria-hidden="true" style="color:#57748f"></i>
        <span style="flex:1;color:#57748f;font-weight:600">${system.label}</span>
        <span class="count" style="font-size:0.7rem;color:var(--text-muted)">${systemTotal}</span>
        <i class="ti ti-chevron-right toggle-chevron" style="font-size:0.75rem;transition:transform 0.2s;margin-left:4px"></i>
      `;

      const body = document.createElement('div');
      body.className = 'sidebar-section-body';
      body.style.display = 'none'; // collapsed by default

      header.onclick = () => {
        const open = body.style.display !== 'none';
        body.style.display = open ? 'none' : '';
        header.querySelector('.toggle-chevron').style.transform = open ? '' : 'rotate(90deg)';
      };

      for (const group of system.groups) {
        for (const disease of group.diseases) {
          const imgs = getImagesForDisease(disease);
          const btn = document.createElement('button');
          btn.className = 'sidebar-item' + (imgs.length === 0 ? ' no-images' : '');
          btn.dataset.disease = disease;
          btn.innerHTML = `<span class="disease-name">${disease}</span><span class="count">${imgs.length || ''}</span>`;
          if (imgs.length > 0) btn.onclick = () => selectDisease(disease);
          body.appendChild(btn);
        }
      }

      section.appendChild(header);
      section.appendChild(body);
      nav.appendChild(section);
    }
  }

  function filterSidebar(e) {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('#sidebar-nav .sidebar-section').forEach(sec => {
      const body = sec.querySelector('.sidebar-section-body');
      const header = sec.querySelector('.sidebar-section-toggle');
      let anyVisible = false;
      sec.querySelectorAll('.sidebar-item[data-disease]').forEach(btn => {
        const name = (btn.dataset.disease || '').toLowerCase();
        const hide = q && !name.includes(q);
        btn.style.display = hide ? 'none' : '';
        if (!hide) anyVisible = true;
      });
      sec.style.display = anyVisible || !q ? '' : 'none';
      // Auto-expand when searching
      if (q && body) {
        body.style.display = anyVisible ? '' : 'none';
        if (header) header.querySelector('.toggle-chevron').style.transform = anyVisible ? 'rotate(90deg)' : '';
      }
    });
  }
  function selectDisease(disease) {
    currentDisease = disease;

    // Update sidebar active states
    document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
    if (disease === null) {
      document.getElementById('nav-all').classList.add('active');
    } else {
      const btn = document.querySelector(`.sidebar-item[data-disease="${CSS.escape(disease)}"]`);
      if (btn) btn.classList.add('active');
    }

    showDisease(disease);
    history.replaceState(null, '', disease ? `?disease=${encodeURIComponent(disease)}` : '?');
  }

  // ── Grid ─────────────────────────────────────────────────────
  function showDisease(disease) {
    const container = document.getElementById('image-grid-container');
    const titleEl   = document.getElementById('browse-title');
    const countEl   = document.getElementById('browse-count');

    let images; // [{ path, disease }]
    if (disease === null) {
      images = [];
      for (const [d, paths] of Object.entries(MANIFEST)) {
        for (const p of paths) images.push({ path: p, disease: d });
      }
      titleEl.textContent = 'All images';
    } else {
      images = getImagesForDisease(disease).map(p => ({ path: p, disease }));
      titleEl.textContent = disease;
    }

    countEl.textContent = `${images.length} image${images.length !== 1 ? 's' : ''}`;
    lightboxImages = images;

    if (images.length === 0) {
      container.innerHTML = `<div class="browse-empty">
        <i class="ti ti-photo-off" aria-hidden="true"></i>
        <p>No images found.<br>Add images and run <code>scan_images.py</code>.</p>
      </div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'image-grid';

    images.forEach(({ path, disease: d }, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.onclick = () => openLightbox(i);
      item.innerHTML = `
        <img src="${path}" alt="${d}" loading="lazy" />
        ${currentDisease === null ? `<div class="grid-item-label">${d}</div>` : ''}
      `;
      grid.appendChild(item);
    });

    container.innerHTML = '';
    container.appendChild(grid);
  }

  // ── Lightbox ──────────────────────────────────────────────────
  function openLightbox(index) {
    lightboxIndex = index;
    renderLightbox();
    document.getElementById('lightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  function lightboxNav(dir) {
    lightboxIndex = Math.max(0, Math.min(lightboxImages.length - 1, lightboxIndex + dir));
    renderLightbox();
  }

  function renderLightbox() {
    const { path, disease } = lightboxImages[lightboxIndex];
    document.getElementById('lightbox-img').src = path;
    document.getElementById('lightbox-img').alt = disease;
    document.getElementById('lightbox-label').textContent = disease;
  }

  // ── Practice from current view ────────────────────────────────
  function practiceCurrentView() {
    const scope = currentDisease ? `disease:${currentDisease}` : 'all';
    const images = currentDisease ? getImagesForDisease(currentDisease) : Object.values(MANIFEST).flat();
    document.getElementById('browse-modal-subtitle').textContent = currentDisease || 'All images';
    document.getElementById('browse-image-count').value = Math.min(20, images.length);
    document.getElementById('browse-image-count').max = images.length;
    document.getElementById('browse-images-available').textContent =
      images.length > 0 ? `${images.length} images available` : 'No images found.';
    document.getElementById('browse-modal').dataset.scope = scope;
    document.getElementById('browse-modal').classList.add('open');
    document.getElementById('browse-image-count').focus();
  }

  function closeBrowseModal() {
    document.getElementById('browse-modal').classList.remove('open');
  }

  function startBrowsePractice() {
    const count = parseInt(document.getElementById('browse-image-count').value, 10);
    const shuffle = document.getElementById('browse-shuffle-toggle').value === 'shuffle';
    if (!count || count < 1) return;
    const scope = document.getElementById('browse-modal').dataset.scope;
    const params = new URLSearchParams({ scope, count, shuffle: shuffle ? '1' : '0' });
    window.location.href = `practice.html?${params}`;
  }

  // ── Keyboard ──────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeBrowseModal();
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')       closeLightbox();
  });
  document.getElementById('browse-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeBrowseModal();
  });
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  init();
</script>
</body>
</html>
