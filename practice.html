<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice — MedFlash</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    /* ── Practice-specific styles ── */
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Top bar ── */
    .practice-bar {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .practice-scope {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .practice-progress {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .progress-bar-wrap {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: var(--accent);
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Main card area ── */
    .practice-main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 24px 8px;
      position: relative;
    }
    /* ── Image card ── */
    .image-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 960px;
      width: 100%;
      height: 100%;
      gap: 0;
}
    .image-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #f0ede8;
      border: 1px solid var(--border);
      position: relative;
      min-height: 0;
      height: 100%;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: var(--radius-lg);
      -webkit-user-drag: none;
    }

    .image-frame .img-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Answer reveal ── */
    .answer-zone {
      flex-shrink: 0;
      width: 100%;
      padding: 20px 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 72px;
    }

    .answer-left {
      flex: 1;
    }

    .answer-label {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text-primary);
      /* transition: opacity 0.2s; */
    }

    .answer-label.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .answer-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .answer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── Bottom nav ── */
    .practice-nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 24px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-size: 1.1rem;
    }

    .nav-btn:hover { background: var(--bg); color: var(--text-primary); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn:disabled:hover { background: var(--surface); color: var(--text-secondary); }

    .reveal-btn {
      padding: 0 22px;
      width: auto;
      font-family: var(--sans);
      font-size: 0.875rem;
      letter-spacing: 0.01em;
      color: var(--text-primary);
    }

    .reveal-btn.revealed {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }
    /* ── Panel lightbox (reuse browse styles) ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,9,8,0.85);
      z-index: 400;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      position: relative;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .lightbox img {
      width: 100%;
      max-width: 100%;
      max-height: calc(90vh - 100px);
      object-fit: contain;
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: block;
    }
    .lightbox-label {
      font-family: var(--serif);
      font-size: 1.2rem;
      color: #fff;
      text-align: center;
    }
    .lightbox-close {
      position: absolute;
      top: -12px; right: -12px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav.prev { left: -52px; }
    .lightbox-nav.next { right: -52px; }

    /* ── More images panel ── */
    .more-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      bottom: 24px;
      width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-y: auto;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .more-panel.open {
      display: flex;
    }

    .more-panel-header {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .thumb {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--bg);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb:hover { border-color: var(--accent); }
    .thumb.active { border-color: var(--accent); }

    /* ── Finished screen ── */
    .finish-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 16px;
      padding: 40px;
    }

    .finish-screen.show { display: flex; }

    .finish-screen h2 {
      font-size: 1.8rem;
      letter-spacing: -0.01em;
    }

    .finish-screen p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 360px;
    }

    .finish-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    /* ── Hint bar ── */
    .hint-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 6px 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .hint-bar.hidden { display: none; }
    .hint-toggle-row {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: 4px 20px 6px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .hint-toggle-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .hint-toggle-btn:hover { background: var(--surface); color: var(--text-primary); }
    .hint-toggle-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

    /* ── Keyboard hint ── */
    .kbd {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border-mid);
      border-bottom-width: 2px;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: var(--sans);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

<!-- Top bar -->
<header class="practice-bar">
  <a href="index.html" class="btn btn-ghost btn-sm" style="padding:8px 14px; color:var(--text-secondary)">
    <i class="ti ti-home" aria-hidden="true"></i>
  </a>
  <div style="position:absolute;left:50%;transform:translateX(-50%);font-family:var(--serif);font-size:1.25rem;color:var(--text-primary)">
    Shinjer's <span style="color:var(--accent)">Practice</span>
  </div>
  <div class="practice-scope" id="scope-label">—</div>
  <div class="practice-progress" id="progress-label"></div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progress-fill"></div>
</div>

<!-- Main area -->
<main class="practice-main" id="practice-main">

  <!-- Practice card -->
  <div class="image-card" id="image-card">
    <div class="image-frame" id="image-frame">
      <div class="img-loading" id="img-loading"><div class="spinner"></div></div>
      <img id="main-img" src="" alt="Medical image" style="display:none" />
    </div>

    <!-- Answer zone -->
    <div class="answer-zone">
      <div class="answer-left">
        <div class="answer-label hidden" id="answer-label">—</div>
        <!-- <div class="answer-hint" id="answer-hint">Press <span class="kbd">Space</span> or <span class="kbd">↵</span> to reveal</div> -->
      </div>
      <div class="answer-right">
        <button class="btn btn-sm" id="more-btn" onclick="toggleMorePanel()" title="Other images of this condition" aria-label="View more images">
          <i class="ti ti-layout-grid" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- More images panel -->
  <div class="more-panel" id="more-panel">
    <div class="more-panel-header">Other views — <span id="panel-disease-name"></span></div>
    <div class="thumb-grid" id="thumb-grid"></div>
  </div>

  <!-- Finished screen (overlays) -->
  <div class="finish-screen" id="finish-screen">
    <div style="font-size:2.5rem; color:var(--accent)">
      <i class="ti ti-circle-check" aria-hidden="true"></i>
    </div>
    <h2>Session complete</h2>
    <p id="finish-summary"></p>
    <div class="finish-actions">
      <button class="btn btn-primary" onclick="repeatSession()">
        <i class="ti ti-refresh" aria-hidden="true"></i> Repeat
      </button>
      <a href="index.html" class="btn">
        <i class="ti ti-home" aria-hidden="true"></i> Home
      </a>
    </div>
  </div>

</main>

<!-- Bottom nav -->
<div class="practice-nav" id="practice-nav">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" title="Previous (← Arrow)">
    <i class="ti ti-arrow-left" aria-hidden="true"></i>
  </button>

  <button class="nav-btn reveal-btn" id="btn-reveal" onclick="reveal()" title="Reveal answer (Space)">
    Reveal
  </button>

  <button class="nav-btn" id="btn-next" onclick="navigate(1)" title="Next (→ Arrow)">
    <i class="ti ti-arrow-right" aria-hidden="true"></i>
  </button>
</div>

<!-- Panel Lightbox -->
<div class="lightbox" id="panel-lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closePanelLightbox()" aria-label="Close">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
    <button class="lightbox-nav prev" onclick="panelLbNav(-1)" aria-label="Previous">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
    </button>
    <img id="plb-img" src="" alt="" />
    <div class="lightbox-label" id="plb-label"></div>
    <div class="lightbox-label" id="plb-counter" style="font-size:0.8rem;opacity:0.6"></div>
    <button class="lightbox-nav next" onclick="panelLbNav(1)" aria-label="Next">
      <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>

<!-- Hint bar -->
<div id="hint-bar" class="hint-bar">
  <span><span class="kbd">←</span><span class="kbd">→</span> Navigate</span>
  <span><span class="kbd">Space</span> / <span class="kbd">↵</span> Reveal &amp; advance</span>
  <span><span class="kbd">H</span><span class="kbd">L</span> also navigate</span>
</div>
<div class="hint-toggle-row">
  <button class="hint-toggle-btn" id="hint-toggle-btn" onclick="toggleHint()" title="Toggle keyboard shortcuts">
    <i class="ti ti-keyboard" aria-hidden="true"></i> <span id="hint-toggle-label">Show shortcuts</span>
  </button>
</div>

<script src="catalog.js"></script>
<script src="app.js"></script>
<script src="practice.js"></script>
</body>
</html>
