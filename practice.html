<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice — MedFlash</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    /* ── Practice-specific styles ── */
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Top bar ── */
    .practice-bar {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .practice-scope {
      font-family: var(--serif);
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .practice-progress {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .progress-bar-wrap {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: var(--accent);
      transition: width 0.3s ease;
      width: 0%;
    }

    /* ── Main card area ── */
    .practice-main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* ── Image card ── */
    .image-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 880px;
      width: 100%;
      height: 100%;
      gap: 0;
    }

    .image-frame {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #f0ede8;
      border: 1px solid var(--border);
      position: relative;
    }

    .image-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: var(--radius-lg);
      /* user-select: none; */
      -webkit-user-drag: none;
    }

    .image-frame .img-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Answer reveal ── */
    .answer-zone {
      flex-shrink: 0;
      width: 100%;
      padding: 20px 0 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 72px;
    }

    .answer-left {
      flex: 1;
    }

    .answer-label {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 400;
      color: var(--text-primary);
      transition: opacity 0.2s;
    }

    .answer-label.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .answer-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .answer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── Bottom nav ── */
    .practice-nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 24px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .nav-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-size: 1.1rem;
    }

    .nav-btn:hover { background: var(--bg); color: var(--text-primary); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-btn:disabled:hover { background: var(--surface); color: var(--text-secondary); }

    .reveal-btn {
      padding: 0 22px;
      width: auto;
      font-family: var(--sans);
      font-size: 0.875rem;
      letter-spacing: 0.01em;
      color: var(--text-primary);
    }

    .reveal-btn.revealed {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── More images panel ── */
    .more-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      bottom: 24px;
      width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow-y: auto;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .more-panel.open {
      display: flex;
    }

    .more-panel-header {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .thumb {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1.5px solid transparent;
      cursor: pointer;
      background: var(--bg);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb:hover { border-color: var(--accent); }
    .thumb.active { border-color: var(--accent); }

    /* ── Finished screen ── */
    .finish-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 16px;
      padding: 40px;
    }

    .finish-screen.show { display: flex; }

    .finish-screen h2 {
      font-size: 1.8rem;
      letter-spacing: -0.01em;
    }

    .finish-screen p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 360px;
    }

    .finish-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    /* ── Keyboard hint ── */
    .kbd {
      display: inline-flex;
      align-items: center;
      font-size: 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border-mid);
      border-bottom-width: 2px;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: var(--sans);
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

<!-- Top bar -->
<header class="practice-bar">
  <a href="index.html" class="btn btn-ghost btn-sm" style="padding:4px 8px; color:var(--text-secondary)">
    <i class="ti ti-home" aria-hidden="true"></i>
  </a>
  <div class="practice-scope" id="scope-label">—</div>
  <div class="practice-progress" id="progress-label"></div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progress-fill"></div>
</div>

<!-- Main area -->
<main class="practice-main" id="practice-main">

  <!-- Practice card -->
  <div class="image-card" id="image-card">
    <div class="image-frame" id="image-frame">
      <div class="img-loading" id="img-loading"><div class="spinner"></div></div>
      <img id="main-img" src="" alt="Medical image" style="display:none" />
    </div>

    <!-- Answer zone -->
    <div class="answer-zone">
      <div class="answer-left">
        <div class="answer-label hidden" id="answer-label">—</div>
        <div class="answer-hint" id="answer-hint">Press <span class="kbd">Space</span> or <span class="kbd">↵</span> to reveal</div>
      </div>
      <div class="answer-right">
        <button class="btn btn-sm" id="more-btn" onclick="toggleMorePanel()" title="See other images for this disease">
          <i class="ti ti-layout-grid" aria-hidden="true"></i> More images
        </button>
      </div>
    </div>
  </div>

  <!-- More images panel -->
  <div class="more-panel" id="more-panel">
    <div class="more-panel-header">All images — <span id="panel-disease-name"></span></div>
    <div class="thumb-grid" id="thumb-grid"></div>
  </div>

  <!-- Finished screen (overlays) -->
  <div class="finish-screen" id="finish-screen">
    <div style="font-size:2.5rem; color:var(--accent)">
      <i class="ti ti-circle-check" aria-hidden="true"></i>
    </div>
    <h2>Session complete</h2>
    <p id="finish-summary"></p>
    <div class="finish-actions">
      <button class="btn btn-primary" onclick="repeatSession()">
        <i class="ti ti-refresh" aria-hidden="true"></i> Repeat
      </button>
      <a href="index.html" class="btn">
        <i class="ti ti-home" aria-hidden="true"></i> Home
      </a>
    </div>
  </div>

</main>

<!-- Bottom nav -->
<div class="practice-nav" id="practice-nav">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" title="Previous (← Arrow)">
    <i class="ti ti-arrow-left" aria-hidden="true"></i>
  </button>

  <button class="nav-btn reveal-btn" id="btn-reveal" onclick="reveal()" title="Reveal answer (Space)">
    Reveal
  </button>

  <button class="nav-btn" id="btn-next" onclick="navigate(1)" title="Next (→ Arrow)">
    <i class="ti ti-arrow-right" aria-hidden="true"></i>
  </button>
</div>

<script src="catalog.js"></script>
<script src="app.js"></script>
<script src="practice.js"></script>
</body>
</html>
