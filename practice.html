<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice — Shinjer's Practice</title>
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/practice.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body>

<!-- Top bar -->
<header class="practice-bar">
  <a href="index.html" class="btn btn-ghost btn-sm" style="padding:8px 14px; color:var(--text-secondary)">
    <i class="ti ti-home" aria-hidden="true"></i>
  </a>
  <div style="position:absolute;left:50%;transform:translateX(-50%);font-weight:bold;font-family:var(--serif);font-size:1.25rem;color:var(--text-primary)">
    Shinjer's <span style="color:var(--accent)">Practice</span>
  </div>
  <div class="practice-scope" id="scope-label">—</div>
  <div class="practice-progress" id="progress-label"></div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progress-fill"></div>
</div>

<!-- Main area -->
<main class="practice-main" id="practice-main">

  <!-- Practice card -->
  <div class="image-card" id="image-card">
    <div class="image-frame" id="image-frame">
      <div class="img-loading" id="img-loading"><div class="spinner"></div></div>
      <img id="main-img" src="" alt="Medical image" style="display:none" />
    </div>

    <!-- Answer zone -->
    <div class="answer-zone">
      <div class="answer-label hidden" id="answer-label">—</div>
      <button class="btn btn-sm" id="more-btn" onclick="toggleMorePanel()" title="Other images of this condition" aria-label="View more images" style="margin-left:auto; display:flex; align-items:center; gap:6px;">
        <i class="ti ti-layout-grid" aria-hidden="true"></i> More images
      </button>
    </div>
  </div>

  <!-- More images panel -->
  <div class="more-panel" id="more-panel">
    <div class="more-panel-header">Other views — <span id="panel-disease-name"></span></div>
    <div class="thumb-grid" id="thumb-grid"></div>
  </div>

  <!-- Finished screen -->
  <div class="finish-screen" id="finish-screen">
    <div style="font-size:2.5rem; color:var(--accent)">
      <i class="ti ti-circle-check" aria-hidden="true"></i>
    </div>
    <h2>Session complete</h2>
    <p id="finish-summary"></p>
    <div class="finish-actions">
      <button class="btn btn-primary" onclick="repeatSession()">
        <i class="ti ti-refresh" aria-hidden="true"></i> Repeat
      </button>
      <a href="index.html" class="btn">
        <i class="ti ti-home" aria-hidden="true"></i> Home
      </a>
    </div>
  </div>

</main>

<!-- Bottom nav -->
<div class="practice-nav" id="practice-nav">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" title="Previous (← Arrow)">
    <i class="ti ti-arrow-left" aria-hidden="true"></i>
  </button>

  <button class="nav-btn reveal-btn" id="btn-reveal" onclick="reveal()" title="Reveal answer (Space)">
    Reveal
  </button>

  <button class="nav-btn" id="btn-next" onclick="navigate(1)" title="Next (→ Arrow)">
    <i class="ti ti-arrow-right" aria-hidden="true"></i>
  </button>
</div>

<!-- Panel Lightbox -->
<div class="lightbox" id="panel-lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closePanelLightbox()" aria-label="Close">
      <i class="ti ti-x" aria-hidden="true"></i>
    </button>
    <button class="lightbox-nav prev" onclick="panelLbNav(-1)" aria-label="Previous">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
    </button>
    <img id="plb-img" src="" alt="" />
    <div class="lightbox-label" id="plb-label"></div>
    <div class="lightbox-label" id="plb-counter" style="font-size:0.8rem;opacity:0.6"></div>
    <button class="lightbox-nav next" onclick="panelLbNav(1)" aria-label="Next">
      <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>

<!-- Hint bar -->
<div id="hint-bar" class="hint-bar">
  <span><span class="kbd">←</span><span class="kbd">→</span> Navigate</span>
  <span><span class="kbd">Space</span> / <span class="kbd">↵</span> Reveal &amp; advance</span>
  <span><span class="kbd">H</span><span class="kbd">L</span> also navigate</span>
</div>
<div class="hint-toggle-row">
  <button class="hint-toggle-btn active" id="hint-toggle-btn" onclick="toggleHint()" title="Toggle keyboard shortcuts">
    <i class="ti ti-keyboard" aria-hidden="true"></i> <span id="hint-toggle-label">Hide shortcuts</span>
  </button>
</div>

<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
<script src="js/practice.js"></script>
</body>
</html>
