<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedFlash — Medical Image Review</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    /* ── Home-specific styles ── */
    .page-hero {
      padding: 52px 0 36px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .page-hero h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .page-hero p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 520px;
    }

    .hero-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ── System grid ── */
    .systems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .system-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .system-card:hover {
      border-color: var(--border-mid);
      box-shadow: var(--shadow-sm);
    }

    .system-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      /* user-select: none; */
    }

    .system-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .system-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-light);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .system-title {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .system-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-family: var(--sans);
    }

    /* ── Checkboxes (system & group) ── */
    .system-checkbox,
    .group-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--border-mid);
      border-radius: 3px;
      background: var(--surface);
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.12s, border-color 0.12s;
    }

    .system-checkbox:checked,
    .group-checkbox:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .system-checkbox:indeterminate,
    .group-checkbox:indeterminate {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .system-checkbox:checked::after,
    .group-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 2.7px;
      width: 8px;
      height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }

    .system-checkbox:indeterminate::after,
    .group-checkbox:indeterminate::after {
      content: '';
      position: absolute;
      left: 3.2px;
      top: 5.5px;
      width: 8px;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
    }

    .system-checkbox:hover:not(:checked):not(:indeterminate),
    .group-checkbox:hover:not(:checked):not(:indeterminate) {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .group-practice-btn {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      font-family: var(--sans);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }
    .group-practice-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .disease-chip.selected {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }
    /* ── Groups inside a card ── */
    .system-body {
      padding: 16px 20px;
    }

    .group-block {
      margin-bottom: 16px;
    }

    .group-block:last-child { margin-bottom: 0; }

    .group-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .disease-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .disease-chip {
      font-size: 0.8rem;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text-secondary);
      background: var(--bg);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      font-family: var(--sans);
    }

    .disease-chip:hover {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .disease-chip.no-images {
      opacity: 0.45;
      cursor: default;
    }

    .disease-chip.no-images:hover {
      background: var(--bg);
      border-color: var(--border);
      color: var(--text-secondary);
    }

    /* ── Practice modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,18,14,0.45);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 440px;
      width: 90%;
      box-shadow: var(--shadow);
    }

    .modal h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-family: var(--sans);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.15s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    /* ── Loading notice ── */
    .load-notice {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .load-notice .spinner {
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <span class="site-logo">Shinjer's <span>Practice</span></span>
    <nav class="site-nav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="browse.html" class="nav-link">Browse</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <div class="page-hero">
      <h1>Image review for EVMS Organ Systems</h1>
      <p>Select an organ system to practice, click any pathology to browse its images, or start a custom session.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="openPracticeModal('all')">
          <i class="ti ti-player-play" aria-hidden="true"></i> Practice all
        </button>
        <a href="browse.html" class="btn">
          <i class="ti ti-photo-search" aria-hidden="true"></i> Browse images
        </a>
      </div>
    </div>

    <div id="systems-container">
      <div class="load-notice">
        <div class="spinner"></div>
        <p>Loading catalog…</p>
      </div>
    </div>
  </div>
</main>

<!-- Practice Setup Modal -->
<div class="modal-overlay" id="practice-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title">Start practice</h2>
    <p class="modal-subtitle" id="modal-subtitle">Configure your session</p>

    <div class="form-group">
      <label class="form-label" for="image-count">Number of images</label>
      <input class="form-input" type="number" id="image-count" min="1" max="200" value="20" />
      <p class="form-note" id="images-available"></p>
    </div>

    <div class="form-group">
      <label class="form-label" for="shuffle-toggle">Order</label>
      <select class="form-input" id="shuffle-toggle">
        <option value="shuffle">Shuffled</option>
        <option value="ordered">In order</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="startPractice()">
        <i class="ti ti-player-play" aria-hidden="true"></i> Begin
      </button>
    </div>
  </div>
</div>

<script src="catalog.js"></script>
<script src="app.js"></script>
<script>
  let currentScope = 'all';
  let selectedDiseases = new Set(); // for multi-select mode
  let multiSelectMode = false;

  async function init() {
    await loadManifest();
    renderSystems();
  }

  function renderSystems() {
    const container = document.getElementById('systems-container');
    container.innerHTML = '';

    const grid = document.createElement('div');
    grid.className = 'systems-grid';

    for (const system of CATALOG) {
      grid.appendChild(buildSystemCard(system));
    }

    container.appendChild(grid);

    // Add multi-select bar
    const bar = document.createElement('div');
    bar.id = 'multiselect-bar';
    bar.style.cssText = `display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
      background:var(--surface);border:1px solid var(--border-mid);border-radius:var(--radius-lg);
      padding:12px 20px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:100;`;
    bar.innerHTML = `
      <span id="multiselect-count" style="font-size:0.85rem;color:var(--text-secondary)">0 selected</span>
      <button class="btn btn-sm" onclick="clearMultiSelect()">Clear</button>
      <button class="btn btn-sm btn-primary" onclick="practiceMultiSelect()">
        <i class="ti ti-player-play"></i> Practice selected
      </button>
    `;
    document.body.appendChild(bar);
  }
  function toggleDisease(disease) {
    if (selectedDiseases.has(disease)) {
      selectedDiseases.delete(disease);
    } else {
      selectedDiseases.add(disease);
    }
    updateMultiSelectUI();
  }
  function buildSystemCard(system) {
    const card = document.createElement('div');
    card.className = 'system-card';
    card.dataset.systemId = system.id;
    const totalImages = countSystemImages(system);

    card.innerHTML = `
      <div class="system-header">
        <div class="system-header-left">
          <input type="checkbox" class="system-checkbox" data-system="${system.id}"
            onclick="event.stopPropagation(); toggleSystem('${system.id}')"
            title="Select all in ${system.label}" />
          <div class="system-icon"><i class="ti ${system.icon}" aria-hidden="true"></i></div>
          <div>
            <div class="system-title">${system.label}</div>
            <div class="system-meta">${totalImages} image${totalImages !== 1 ? 's' : ''}</div>
          </div>
        </div>
      </div>
      <div class="system-body">
        ${system.groups.map(g => buildGroup(g, system)).join('')}
      </div>
    `;
    return card;
  }

  function buildGroup(group, system) {
    const groupImages = group.diseases.reduce((n, d) => n + getImagesForDisease(d).length, 0);
    const groupId = `group:${system.id}:${encodeURIComponent(group.label)}`;
    const hasImages = groupImages > 0;

    const chips = group.diseases.map(d => {
      const imgs = getImagesForDisease(d);
      const hasImg = imgs.length > 0;
      const count = hasImg ? ` <span style="color:var(--text-muted);font-size:0.72rem">${imgs.length}</span>` : '';
      const isSelected = selectedDiseases.has(d);
      return `<button class="disease-chip${hasImg ? '' : ' no-images'}${isSelected ? ' selected' : ''}"
        ${hasImg ? `onclick="handleChipClick(event, '${escAttr(d)}')"` : ''}
      title="${hasImg ? `${imgs.length} image${imgs.length !== 1 ? 's' : ''}` : 'No images loaded'}"
        >${d}${count}</button>`;
    }).join('');

    return `
      <div class="group-block">
        <div class="group-label" style="display:flex;align-items:center;gap:7px;">
          ${hasImages ? `<input type="checkbox" class="group-checkbox"
            data-system="${escAttr(system.id)}" data-group="${escAttr(group.label)}"
            onclick="event.stopPropagation(); toggleGroup('${escAttr(system.id)}','${escAttr(group.label)}')"
            title="Select all in ${escAttr(group.label)}" />` : `<span style="width:16px;flex-shrink:0;display:inline-block"></span>`}
          <span class="group-label-text">${group.label}</span>
          <span style="margin-left:auto;font-size:0.7rem;color:var(--text-muted)">${groupImages}</span>
        </div>
        <div class="disease-chips">${chips}</div>
      </div>
    `;
  }

  function handleChipClick(e, disease) {
    e.preventDefault();
    toggleDisease(disease);
  }

  // toggleMultiSelectMode removed — selection is always-on via checkboxes and chips

  function toggleGroup(systemId, groupLabel) {
    const sys = CATALOG.find(s => s.id === systemId);
    if (!sys) return;
    const group = sys.groups.find(g => g.label === groupLabel);
    if (!group) return;
    const diseases = group.diseases.filter(d => getImagesForDisease(d).length > 0);
    const anySelected = diseases.some(d => selectedDiseases.has(d));  // <-- changed
    diseases.forEach(d => anySelected ? selectedDiseases.delete(d) : selectedDiseases.add(d));  // <-- changed
    updateMultiSelectUI();
  }

  function toggleSystem(systemId) {
    const sys = CATALOG.find(s => s.id === systemId);
    if (!sys) return;
    const diseases = sys.groups.flatMap(g => g.diseases).filter(d => getImagesForDisease(d).length > 0);
    const anySelected = diseases.some(d => selectedDiseases.has(d));  // <-- changed
    diseases.forEach(d => anySelected ? selectedDiseases.delete(d) : selectedDiseases.add(d));  // <-- changed
    updateMultiSelectUI();
  }

  function updateMultiSelectUI() {
    const bar = document.getElementById('multiselect-bar');
    if (!bar) return;
    if (selectedDiseases.size > 0) {
      bar.style.display = 'flex';
      document.getElementById('multiselect-count').textContent =
        `${selectedDiseases.size} patholog${selectedDiseases.size === 1 ? 'y' : 'ies'} selected`;
    } else {
      bar.style.display = 'none';
    }

    // Update chip styles
    document.querySelectorAll('.disease-chip').forEach(chip => {
      const name = chip.textContent.replace(/\s*\d+\s*$/, '').trim();
      if (selectedDiseases.has(name)) {
        chip.classList.add('selected');
      } else {
        chip.classList.remove('selected');
      }
    });

    // Update group checkboxes (checked / indeterminate / unchecked)
    document.querySelectorAll('.group-checkbox').forEach(cb => {
      const systemId = cb.dataset.system;
      const groupLabel = cb.dataset.group;
      const sys = CATALOG.find(s => s.id === systemId);
      if (!sys) return;
      const group = sys.groups.find(g => g.label === groupLabel);
      if (!group) return;
      const withImages = group.diseases.filter(d => getImagesForDisease(d).length > 0);
      const selectedCount = withImages.filter(d => selectedDiseases.has(d)).length;
      cb.checked = selectedCount === withImages.length && withImages.length > 0;
      cb.indeterminate = selectedCount > 0 && selectedCount < withImages.length;
    });

    // Update system checkboxes (checked / indeterminate / unchecked)
    document.querySelectorAll('.system-checkbox').forEach(cb => {
      const systemId = cb.dataset.system;
      const sys = CATALOG.find(s => s.id === systemId);
      if (!sys) return;
      const withImages = sys.groups.flatMap(g => g.diseases).filter(d => getImagesForDisease(d).length > 0);
      const selectedCount = withImages.filter(d => selectedDiseases.has(d)).length;
      cb.checked = selectedCount === withImages.length && withImages.length > 0;
      cb.indeterminate = selectedCount > 0 && selectedCount < withImages.length;
    });
  }

  function clearMultiSelect() {
    selectedDiseases.clear();
    updateMultiSelectUI();
  }

  function practiceMultiSelect() {
    if (selectedDiseases.size === 0) return;
    const scope = 'multi:' + [...selectedDiseases].join('|||');
    openPracticeModal(scope);
  }

  function countSystemImages(system) {
    let n = 0;
    for (const g of system.groups) {
      for (const d of g.diseases) n += getImagesForDisease(d).length;
    }
    return n;
  }

  function openPracticeModal(scope) {
    currentScope = scope;
    let images;
    if (scope.startsWith('multi:')) {
      images = getImagesForMultiScope(scope);
    } else if (scope.startsWith('group:')) {
      images = getImagesForGroupScope(scope);
    } else {
      images = getImagesForScope(scope);
    }

    let subtitle = 'All systems';
    if (scope === 'all') subtitle = 'All systems';
    else if (scope.startsWith('disease:')) subtitle = scope.replace('disease:', '');
    else if (scope.startsWith('group:')) {
      const parts = scope.split(':');
      subtitle = decodeURIComponent(parts[2] || scope);
    } else if (scope.startsWith('multi:')) {
      const diseases = scope.replace('multi:', '').split('|||');
      subtitle = diseases.slice(0, 2).join(', ') + (diseases.length > 2 ? ` +${diseases.length - 2} more` : '');
    } else {
      const sys = CATALOG.find(s => s.id === scope);
      if (sys) subtitle = sys.label;
    }

    document.getElementById('modal-subtitle').textContent = subtitle;
    document.getElementById('image-count').value = Math.min(20, images.length);
    document.getElementById('image-count').max = images.length;
    document.getElementById('images-available').textContent =
      images.length > 0 ? `${images.length} images available` : 'No images found for this selection.';

    document.getElementById('practice-modal').classList.add('open');
    document.getElementById('image-count').focus();
  }

  function closeModal() {
    document.getElementById('practice-modal').classList.remove('open');
  }

  document.getElementById('practice-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  function startPractice() {
    const count = parseInt(document.getElementById('image-count').value, 10);
    const shuffle = document.getElementById('shuffle-toggle').value === 'shuffle';
    if (!count || count < 1) return;
    const params = new URLSearchParams({ scope: currentScope, count, shuffle: shuffle ? '1' : '0' });
    window.location.href = `practice.html?${params}`;
  }

  function escAttr(s) {
    return s.replace(/'/g, "\\'");
  }

  init();
</script>
</body>
</html>
